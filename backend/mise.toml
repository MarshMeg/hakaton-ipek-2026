# Бэкенд: Python + Tailwind CLI. Используется и локально, и в Dockerfile.
[tools]
python = "3.12"
"github:tailwindlabs/tailwindcss" = "3.4.17"      # standalone CLI, Node.js не нужен

[env]
# Виртуальное окружение backend/.venv создаётся и активируется автоматически
# (--seed: если mise создаёт его через uv, в нём должен быть pip).
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.setup]
description = "Установить зависимости, применить миграции, загрузить стартовый курс"
run = [
  "python -m pip install -r requirements-dev.txt",
  "python manage.py migrate",
  "python manage.py seed",
]

[tasks.dev]
description = "Сервер разработки на http://localhost:8000"
run = "python manage.py runserver 0.0.0.0:8000"

[tasks.test]
description = "Тесты (pytest); аргументы пробрасываются: mise run test -- -k lesson"
run = "pytest"

[tasks.lint]
description = "Проверки как в CI: ruff, формат, миграции"
run = [
  "ruff check .",
  "ruff format --check .",
  "python manage.py makemigrations --check --dry-run",
]

[tasks.fmt]
description = "Автоформатирование и автоисправления ruff"
run = ["ruff format .", "ruff check --fix ."]

[tasks.css]
description = "Пересобрать static/css/app.css после изменения классов Tailwind"
run = "tailwindcss -i static/css/input.css -o static/css/app.css --minify"

[tasks."css:watch"]
description = "Пересобирать CSS при изменении шаблонов"
run = "tailwindcss -i static/css/input.css -o static/css/app.css --watch"

[tasks.seed]
description = "Перезагрузить курс из seeds/content.yaml"
run = "python manage.py seed --reset"
