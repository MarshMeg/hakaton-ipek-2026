# Факты для экрана «Профиль». Перед сдачей сверить с источниками (и цифры переписи).
facts:
  - Удмуртский язык — государственный язык Удмуртской Республики наравне с русским.
  - Удмуртский язык — финно-угорский. Самый близкий родственник — коми язык, а дальние — финский, эстонский и венгерский.
  - В удмуртском алфавите 38 букв — все русские и ещё пять своих: Ӝ, Ӟ, Ӥ, Ӧ, Ӵ.
  - По переписи 2010 года удмуртским языком владели около 324 тысяч человек.
  - В удмуртских словах ударение обычно падает на последний слог.
  - В удмуртском нет мужского и женского рода — «он» и «она» обозначаются одним словом «со».
  - Первая грамматика удмуртского языка была напечатана в 1775 году.
