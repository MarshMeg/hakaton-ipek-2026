{% comment %} Первый запуск: ребёнок вводит имя и выбирает зверька — это и есть «регистрация».
   Профиль хранится на телефоне и работает без интернета. {% endcomment %}
<div x-cloak x-show="!$store.app.profile"
     class="fixed inset-0 z-40 flex items-end justify-center bg-black/50 sm:items-center"
     x-data="{ name: '', avatar: ZB.AVATARS[0], step: 0 }">
  <div class="w-full max-w-md rounded-t-3xl bg-white p-6 sm:rounded-3xl">
    <template x-if="step === 0">
      <div class="text-center">
        <div class="text-6xl">👋</div>
        <h2 class="mt-3 text-2xl font-extrabold">Ӟечбуресь! Здравствуй!</h2>
        <p class="mt-2 text-gray-600">
          Здесь ты выучишь первые удмуртские слова и сыграешь в игры. За верные ответы получаешь ⭐,
          а за каждый день занятий подряд — 🔥.
        </p>
        <button class="btn-primary mt-6 w-full" @click="step = 1">Начать</button>
      </div>
    </template>
    <template x-if="step === 1">
      <form @submit.prevent="$store.app.createProfile(name, avatar)">
        <h2 class="text-2xl font-extrabold">Как тебя зовут?</h2>
        <input x-model="name" maxlength="60" required autofocus placeholder="Имя"
               class="mt-4 w-full rounded-2xl border-2 border-gray-300 px-4 py-3 text-lg focus:border-brand-red focus:outline-none">
        <p class="mt-5 font-bold">Выбери зверька</p>
        <div class="mt-2 grid grid-cols-5 gap-2">
          <template x-for="a in ZB.AVATARS" :key="a">
            <button type="button" class="rounded-2xl border-2 py-2 text-3xl"
                    :class="avatar === a ? 'border-brand-red bg-red-50' : 'border-gray-200'"
                    @click="avatar = a" x-text="a"></button>
          </template>
        </div>
        <button class="btn-primary mt-6 w-full" :disabled="!name.trim()">Готово</button>
        <a href="/profile/#cloud" class="mt-3 block text-center text-sm font-bold text-gray-500 underline"
           @click="$store.app.createProfile('Гость', avatar)">У меня уже есть аккаунт</a>
      </form>
    </template>
  </div>
</div>
