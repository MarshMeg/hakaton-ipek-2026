<form method="post" class="mt-6 grid gap-4">
  {% csrf_token %}
  {% for field in form %}
  <label class="grid gap-1 font-bold">
    {{ field.label }}
    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" required
           value="{% if field.field.widget.input_type != 'password' %}{{ field.value|default:'' }}{% endif %}"
           class="rounded-2xl border-2 border-gray-300 bg-white px-4 py-3 font-normal focus:border-brand-red focus:outline-none">
    {% for err in field.errors %}<span class="text-sm text-bad">{{ err }}</span>{% endfor %}
  </label>
  {% endfor %}
  {% for err in form.non_field_errors %}<p class="text-sm text-bad">{{ err }}</p>{% endfor %}
  <button class="btn-primary">{{ submit_label }}</button>
</form>
