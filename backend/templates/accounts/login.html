{% extends "base.html" %}
{% block content %}
<h1 class="mt-8 text-2xl font-extrabold">Ӟечбуресь!</h1>
<p class="text-gray-600">Войди, чтобы учить удмуртский и не терять прогресс.</p>
{% include "accounts/_form.html" with submit_label="Войти" %}

<form method="post" action="{% url 'accounts:guest' %}" class="mt-6 text-center text-sm">

</form>
{% endblock %}
