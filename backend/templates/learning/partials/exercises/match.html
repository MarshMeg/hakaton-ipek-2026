{# Пары проверяются на клиенте: неверная пара подсвечивается, когда все найдены — форма отправляется. #}
{% if feedback %}
  <p class="text-lg font-bold text-ok">Все пары найдены!</p>
{% else %}
{{ options|json_script:"match-data" }}
<div class="grid grid-cols-2 gap-3" x-data="{
  data: JSON.parse(document.getElementById('match-data').textContent),
  sel: null, matched: [], wrong: null,
  get matchedRight() { return this.matched.map(l => this.data.pairs[l]) },
  pickRight(r) {
    if (!this.sel || this.matchedRight.includes(r)) return;
    if (this.data.pairs[this.sel] === r) {
      this.matched.push(this.sel);
      this.sel = null;
      if (this.matched.length === this.data.left.length) {
        this.$nextTick(() => this.$root.closest('form').requestSubmit());
      }
    } else {
      this.wrong = r;
      setTimeout(() => this.wrong = null, 600);
    }
  },
}">
  <div class="grid gap-3">
    <template x-for="l in data.left" :key="l">
      <button type="button" class="tile" x-text="l" :disabled="matched.includes(l)"
              :class="{ '!border-brand-red bg-red-50': sel === l, 'opacity-30': matched.includes(l) }"
              @click="sel = l"></button>
    </template>
  </div>
  <div class="grid gap-3">
    <template x-for="r in data.right" :key="r">
      <button type="button" class="tile" x-text="r" :disabled="matchedRight.includes(r)"
              :class="{ '!border-bad bg-red-100 animate-pulse': wrong === r, 'opacity-30': matchedRight.includes(r) }"
              @click="pickRight(r)"></button>
    </template>
  </div>
  <input type="hidden" name="answer" value="ok">
</div>
{% endif %}
