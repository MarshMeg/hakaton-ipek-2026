<div class="grid gap-3">
  {% for opt in options %}
  <label class="tile flex items-center gap-3 has-[:checked]:border-brand-red has-[:checked]:bg-red-50
    {% if feedback and opt == feedback.correct_answer %}!border-ok !bg-green-50{% endif %}">
    <input type="radio" name="answer" value="{{ opt }}" class="sr-only" required {% if opt == given %}checked{% endif %}>
    <span class="flex h-7 w-7 items-center justify-center rounded-lg border-2 border-gray-300 text-sm text-gray-400">{{ forloop.counter }}</span>
    {{ opt }}
  </label>
  {% endfor %}
</div>
