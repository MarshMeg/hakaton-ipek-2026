{% if feedback %}
  <p class="rounded-2xl border-2 border-gray-200 bg-white p-4 text-lg font-bold">{{ given|default:"—" }}</p>
{% else %}
{{ options|json_script:"assemble-tiles" }}
<div x-data="{
  tiles: JSON.parse(document.getElementById('assemble-tiles').textContent).map((w, i) => ({ w, i })),
  picked: [],
  isPicked(t) { return this.picked.includes(t) },
}">
  <div class="flex min-h-16 flex-wrap gap-2 border-b-2 border-gray-300 pb-3">
    <template x-for="t in picked" :key="t.i">
      <button type="button" class="tile" x-text="t.w" @click="picked.splice(picked.indexOf(t), 1)"></button>
    </template>
  </div>
  <div class="mt-6 flex flex-wrap justify-center gap-2">
    <template x-for="t in tiles" :key="t.i">
      <button type="button" class="tile" :class="isPicked(t) && 'invisible'" x-text="t.w"
              @click="picked.push(t)"></button>
    </template>
  </div>
  <input type="hidden" name="answer" :value="picked.map(t => t.w).join(' ')">
</div>
{% endif %}
