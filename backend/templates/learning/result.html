{% extends "base.html" %}
{% block content %}
<div class="mt-10 text-center">
  <div class="text-7xl">🎉</div>
  <h1 class="mt-4 text-3xl font-extrabold">Урок пройден!</h1>
  <p class="mt-1 text-lg font-bold text-brand-red">Туж ӟеч! (Очень хорошо!)</p>
  <div class="mt-8 grid grid-cols-3 gap-3">
    <div class="rounded-2xl border-2 border-brand-sun bg-white p-3"><p class="text-sm font-bold text-gray-500">Опыт</p><p class="text-2xl font-extrabold">+{{ result.xp }}</p></div>
    <div class="rounded-2xl border-2 border-gray-300 bg-white p-3"><p class="text-sm font-bold text-gray-500">Ошибок</p><p class="text-2xl font-extrabold">{{ result.mistakes }}</p></div>
    <div class="rounded-2xl border-2 border-brand-red bg-white p-3"><p class="text-sm font-bold text-gray-500">Дней подряд</p><p class="text-2xl font-extrabold">🔥 {{ result.streak }}</p></div>
  </div>
  <div class="mt-10 grid gap-3">
    <a href="{% url 'learning:home' %}" class="btn-primary">Продолжить</a>
    <a href="{% url 'learning:lesson_start' lesson.id %}" class="btn-ghost">Пройти ещё раз</a>
  </div>
</div>
{% endblock %}
