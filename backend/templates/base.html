{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <title>{% block title %}Вотэс — учим удмуртский{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
</head>
<body class="min-h-screen bg-brand-paper font-sans text-brand-ink antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block header %}
  <header class="sticky top-0 z-10 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-xl items-center justify-between px-4 py-3">
      <a href="{% url 'learning:home' %}" class="flex items-center gap-2 text-xl font-extrabold">
        <img src="{% static 'img/logo.svg' %}" alt="" class="h-8 w-8"> Вотэс
      </a>
      {% if profile %}
      <div class="flex items-center gap-4 font-bold">
        <span title="Дней подряд">🔥 {{ profile.streak }}</span>
        <span title="Опыт">⭐ {{ profile.xp }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="text-sm text-gray-500 underline" title="{{ user.username }}">Выйти</button>
        </form>
      </div>
      {% endif %}
    </div>
    <div class="ornament h-3"></div>
  </header>
  {% endblock %}
  <main class="mx-auto max-w-xl px-4 pb-10">{% block content %}{% endblock %}</main>
</body>
</html>
