name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org ru.votes .
      - run: flutter pub get
      - run: flutter analyze
      # Адрес сервера для сборки задаётся переменной репозитория SERVER_URL (Settings → Variables).
      - run: flutter build apk --release --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'http://10.0.2.2:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: votes-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
