name: CI

# Проверки бэкенда. Сборка APK — в android.yml (только при изменениях в mobile/).

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q

  # Деплой на сервер: только из main и только после зелёных проверок. На сервер копируются
  # исходники, образ собирается там же (docker compose). Файл .env на сервере не трогается.
  # Настройки репозитория: секрет DEPLOY_SSH_KEY, переменные DEPLOY_HOST, DEPLOY_USER,
  # DEPLOY_KNOWN_HOSTS и DEPLOY_URL (адрес для проверки после деплоя).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - name: SSH-ключ и отпечаток сервера
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Скопировать проект на сервер
        run: >
          rsync -az --delete
          --exclude .git --exclude .github --exclude .env --exclude mobile --exclude docs
          ./ "$TARGET:/opt/votes/"
      - name: Пересобрать и перезапустить
        run: ssh "$TARGET" "cd /opt/votes && $COMPOSE up -d --build --remove-orphans && docker image prune -f"
      - name: Проверить, что сайт отвечает
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null "${{ vars.DEPLOY_URL }}/accounts/login/"
