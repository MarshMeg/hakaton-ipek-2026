name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org ru.votes .
      - run: flutter pub get
      - run: flutter analyze
      # Адрес сервера вшивается в APK. Можно переопределить переменной репозитория SERVER_URL
      # (Settings → Secrets and variables → Actions → Variables).
      - run: flutter build apk --release --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/votes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: votes-apk
          path: mobile/build/votes.apk

  # На каждый push в main публикуется GitHub Release с APK — его можно скачать без входа в GitHub:
  # https://github.com/MarshMeg/hakaton-ipek-2026/releases/latest/download/votes.apk
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: votes-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Вотэс — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: votes.apk
          body: |
            APK для Android, сервер: ${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
            Коммит: ${{ github.sha }}
