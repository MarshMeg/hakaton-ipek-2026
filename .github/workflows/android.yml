name: Android

# APK собирается только при изменениях в mobile/ (или в этом файле).
# Пересобрать вручную, например после смены переменной SERVER_URL: Actions → Android → Run workflow.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org ru.votes .
      - run: flutter pub get
      # Иконка приложения поверх стандартной из flutter create (настройки — в pubspec.yaml).
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      # Адрес сервера вшивается в APK. Можно переопределить переменной репозитория SERVER_URL
      # (Settings → Secrets and variables → Actions → Variables).
      - run: flutter build apk --release --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/votes.apk
      # Вторая сборка — для проверки: при запуске спрашивает, какой адрес открыть.
      - run: flutter build apk --release --dart-define=ASK_SERVER_URL=true --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/votes-ask.apk
      - uses: actions/upload-artifact@v4
        with:
          name: votes-apk
          path: |
            mobile/build/votes.apk
            mobile/build/votes-ask.apk

  # Сборка из main публикуется как GitHub Release с APK:
  # https://github.com/MarshMeg/hakaton-ipek-2026/releases/latest/download/votes.apk
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: votes-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Вотэс — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            votes.apk
            votes-ask.apk
          body: |
            votes.apk — APK для Android, сервер: ${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
            votes-ask.apk — сборка для проверки: при запуске спрашивает адрес сервера
            Коммит: ${{ github.sha }}
