name: Android

# APK собирается при изменениях в mobile/ и backend/: в APK кладётся офлайн-снимок
# (страницы, словарь, картинки), который собирает бэкенд.
# Пересобрать вручную, например после смены переменной SERVER_URL: Actions → Android → Run workflow.
on:
  push:
    paths:
      - "mobile/**"
      - "backend/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Офлайн-снимок из seeds/vocab.yaml — так же, как его собирает сервер при старте
      # (DEBUG=0 + collectstatic: те же адреса статики, та же версия снимка).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Офлайн-снимок
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed
          python manage.py collectstatic --noinput
          python manage.py build_bundle --out ../mobile/assets/bundle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org ru.votes .
      - run: flutter pub get
      - run: flutter analyze
      # Адрес сервера вшивается в APK. Можно переопределить переменной репозитория SERVER_URL
      # (Settings → Secrets and variables → Actions → Variables).
      - run: flutter build apk --release --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/votes.apk
      - run: ls -lh build/votes.apk   # ТЗ: желательно не больше 100–150 МБ
      - uses: actions/upload-artifact@v4
        with:
          name: votes-apk
          path: mobile/build/votes.apk

  # Сборка из main публикуется как GitHub Release с APK:
  # https://github.com/MarshMeg/hakaton-ipek-2026/releases/latest/download/votes.apk
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: votes-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ӟеч-а бур-а удмурт кыл? — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: votes.apk
          body: |
            APK для Android, сервер: ${{ vars.SERVER_URL || 'https://hakaton.marshmeg.ru' }}
            Коммит: ${{ github.sha }}
