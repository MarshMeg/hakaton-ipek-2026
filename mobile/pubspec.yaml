name: votes
description: "Ӟеч-а бур-а удмурт кыл? — игра для изучения удмуртского языка (офлайн-обёртка над веб-приложением)."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.6
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_local_notifications: ^22.3.2
  geolocator: ^14.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Офлайн-снимок приложения (собирается из backend: mise run bundle). Каталоги должны
  # существовать даже без снимка — в репозитории лежат .gitkeep.
  assets:
    - assets/bundle/
    - assets/bundle/blobs/
